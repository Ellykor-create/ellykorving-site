<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Welkom – 365 Gates of Awareness</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brown:  #1A1614;
      --cream:  #F5F2EC;
      --pink:   #C04A78;
      --gold:   #B89A6A;
      --cream2: #EDE8DF;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background-color: var(--brown);
      color: var(--cream);
      font-family: 'Raleway', sans-serif;
      font-weight: 300;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* ─── HEADER ────────────────────────────────────────── */
    .page-header {
      padding: 48px 24px 32px;
      text-align: center;
    }

    .eyebrow {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 16px;
      display: block;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.2s forwards;
    }

    .page-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(38px, 10vw, 64px);
      font-weight: 300;
      line-height: 1.05;
      color: var(--cream);
      opacity: 0;
      animation: fadeUp 0.8s ease 0.4s forwards;
    }

    .page-title em {
      font-style: italic;
      color: var(--gold);
    }

    .header-line {
      width: 44px;
      height: 1px;
      background: var(--gold);
      margin: 20px auto;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.6s forwards;
    }

    .page-subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(16px, 4.5vw, 20px);
      font-style: italic;
      font-weight: 300;
      color: rgba(245,242,236,0.60);
      line-height: 1.6;
      max-width: 340px;
      margin: 0 auto;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.75s forwards;
    }

    /* ─── VIDEO ─────────────────────────────────────────── */
    .video-wrapper {
      width: 100%;
      padding: 0 0 32px;
      opacity: 0;
      animation: fadeUp 0.9s ease 0.9s forwards;
    }

    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 */
      background: #000;
    }

    .video-container iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ─── TEKST ONDER VIDEO ─────────────────────────────── */
    .below-video {
      padding: 36px 28px 56px;
      text-align: center;
      max-width: 480px;
      margin: 0 auto;
    }

    .below-video p {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(18px, 5vw, 22px);
      font-style: italic;
      font-weight: 300;
      color: rgba(245,242,236,0.65);
      line-height: 1.7;
      margin-bottom: 36px;
      opacity: 0;
      animation: fadeUp 0.8s ease 1.2s forwards;
    }

    .divider-gold {
      width: 36px;
      height: 1px;
      background: rgba(184,154,106,0.4);
      margin: 0 auto 36px;
      opacity: 0;
      animation: fadeUp 0.6s ease 1.4s forwards;
    }

    /* ─── BUTTON ────────────────────────────────────────── */
    .btn-primary {
      display: inline-block;
      background: var(--pink);
      color: #fff;
      font-family: 'Raleway', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 18px 40px;
      transition: background 0.25s ease, transform 0.2s ease;
      opacity: 0;
      animation: fadeUp 0.8s ease 1.5s forwards;
    }

    .btn-primary:hover {
      background: #a83d67;
      transform: translateY(-2px);
    }

    /* ─── FOOTER ────────────────────────────────────────── */
    footer {
      border-top: 1px solid rgba(245,242,236,0.08);
      padding: 32px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    footer .footer-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 17px;
      color: rgba(245,242,236,0.55);
    }

    footer .footer-sub {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(245,242,236,0.25);
    }

    /* ─── ANIMATIES ─────────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─── DESKTOP: centreer de video ───────────────────── */
    @media (min-width: 680px) {
      .video-wrapper {
        padding: 0 40px 40px;
      }

      .video-container {
        max-width: 720px;
        margin: 0 auto;
        padding-bottom: 0;
        height: 405px;
      }

      .video-container iframe {
        position: static;
        width: 100%;
        height: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="page-header">
    <span class="eyebrow">365 Gates of Awareness</span>
    <h1 class="page-title">Welkom.<br /><em>Kijk eerst dit.</em></h1>
    <div class="header-line"></div>
    <p class="page-subtitle">
      Een persoonlijk welkomstwoord van Elly Elizabeth
    </p>
  </header>

  <!-- VIDEO -->
  <div class="video-wrapper">
    <div class="video-container">
      <iframe
        src="https://player.vimeo.com/video/1148099559?h=3cb7fd75e8&autoplay=0&title=0&byline=0&portrait=0&color=B89A6A"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen
        title="Welkomstvideo 365 Gates of Awareness">
      </iframe>
    </div>
  </div>

  <!-- TEKST ONDER VIDEO -->
  <div class="below-video">
    <p>
      Luister… en je zult je herinneren wie je was,<br />
      voordat de wereld je vertelde wie je moest zijn.
    </p>
    <div class="divider-gold"></div>
    <a href="https://ellykorving.com/dankjewel365" class="btn-primary">
      Ga naar jouw startpagina
    </a>
  </div>

  <!-- FOOTER -->
  <footer>
    <span class="footer-name">Elly Elizabeth Korving</span>
    <span class="footer-sub">Life Coach · Business Coach · Spiritual Guide</span>
  </footer>

</body>
</html>
